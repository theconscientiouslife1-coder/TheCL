<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conscientious Life: Holistic Well-being, Environment, & Personal Growth Blog</title>
    <meta name="description" content="Discover lasting fulfillment through small, measurable steps. Unify Fitness, Diet, Well-being, and Environment to connect with your true, conscientious self.">
    
    <link rel="stylesheet" href="/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; display: flex; flex-direction: column; min-height: 100vh; }
        .flex-grow { flex-grow: 1; }
        @keyframes slide-up-and-fade {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .slide-up { animation: slide-up-and-fade 0.8s ease-out forwards; }
        .opacity-0 { opacity: 0; }
    </style>
</head>
<body class="bg-neutral-50 text-gray-800">

    <div class="top-ribbon"></div>

    <header class="bg-white shadow-sm border-b border-gray-100 sticky top-0 z-50">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center py-4">
                <a href="index.html" class="flex items-center space-x-2 text-gray-800">
                    <span class="text-xl md:text-2xl font-bold text-[#14947c]">Δ</span>
                    <span class="text-lg md:text-xl font-medium tracking-tight">The Conscientious Life</span>
                </a>
                
                <nav class="hidden md:flex items-center space-x-8 text-sm font-medium text-gray-600">
                    <a href="About.html" class="hover:text-[#14947c] transition-colors">About</a>
                    <a href="#" class="hover:text-[#14947c] transition-colors">Resources</a>
                </nav>

                <button id="mobile-menu-button" class="md:hidden p-2 text-gray-600">
                    <i data-lucide="menu" class="w-6 h-6"></i>
                </button>
            </div>

            <div id="mobile-menu" class="hidden md:hidden pb-4 space-y-2">
                <a href="About.html" class="block py-2 text-gray-600 hover:text-[#14947c]">About</a>
                <a href="#" class="block py-2 text-gray-600 hover:text-[#14947c]">Resources</a>
            </div>
        </div>
    </header>

    <section class="bg-[#14947c] py-20 text-center text-white">
        <div class="container mx-auto px-4">
            <h1 class="text-4xl md:text-6xl font-bold mb-6 slide-up">The Conscientious Life</h1>
            <p class="text-lg md:text-xl opacity-90 max-w-2xl mx-auto slide-up" style="animation-delay: 0.2s;">
                Small, intentional steps toward a balanced and sustainable future.
            </p>
        </div>
    </section>

    <main class="flex-grow container mx-auto px-4 sm:px-6 lg:px-8 py-16">
        <section class="mb-20">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                <a href="diet.html" class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 hover:shadow-md transition-all group animate-on-scroll opacity-0">
                    <div class="p-3 bg-teal-50 rounded-xl text-[#14947c] mb-4 inline-block group-hover:bg-[#14947c] group-hover:text-white transition-colors">
                        <i data-lucide="apple" class="w-8 h-8"></i>
                    </div>
                    <h3 class="text-xl font-bold text-gray-900 mb-2">Diet</h3>
                    <p class="text-gray-600 text-sm leading-relaxed">Mindful nutrition that supports both your body and the planet.</p>
                </a>
                </div>
        </section>
    </main>

    <script>
        lucide.createIcons();

        // Restore Mobile Menu Logic
        const menuBtn = document.getElementById('mobile-menu-button');
        const menu = document.getElementById('mobile-menu');
        menuBtn.addEventListener('click', () => menu.classList.toggle('hidden'));

        // Scroll animations
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('slide-up');
                    entry.target.classList.remove('opacity-0');
                }
            });
        }, { threshold: 0.1 });
        document.querySelectorAll('.animate-on-scroll').forEach(s => observer.observe(s));
    </script>
</body>
</html>
